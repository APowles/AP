/* auto-update: if this copy is older than the published version, reload once with the new one (saved ticks are kept) */
(function () {
  var B = 'bb58b56288'; window.AP_BUILD = B;
  function check() {
    if (!/^https?:$/.test(location.protocol) || !window.fetch) return;
    var f = decodeURIComponent(location.pathname.split('/').pop() || '');
    fetch('versions.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
      var n = v && v[f]; if (!n || n === B) return;
      try { if (sessionStorage.getItem('apUpdTo:' + f) === n) return; sessionStorage.setItem('apUpdTo:' + f, n); } catch (e) { }
      var u = location.href.replace(/([?&])v=[^&#]*&?/, '$1').replace(/[?&]$/, '').replace(/#.*$/, '');
      location.replace(u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + n + location.hash);
    }).catch(function () { });
  }
  check();
  window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
})();

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eton IPA Studio</title>
<style id="aph-style">
/* ===== AP HOUSE STYLE v1 ===== */
/* One shared look for every AP app. Paste this block unchanged into each app (inside <style id="aph-style">);
   each app's own CSS comes after it and holds only app-specific bits. Class names all start with "aph-".
   Fonts (Andrew's font rule): Playfair Display ONLY for the app title in the header and each screen's main heading
   (.aph-title, .aph-h, .aph-panel-title, .aph-res-score, print titles .aph-ptitle); DM Sans for everything else —
   prompts, answers, tiles, drill-bar name, card titles, sub-headings, tables, buttons/inputs/selects. */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{
  --navy:#1a2744; --navy2:#243260; --gold:#c9a84c; --gold-light:#f0d78c; --gold2:#ffd76a;
  --cream:#faf8f3; --white:#fff; --text:#1a2744; --text2:#4a5a7a; --text3:#8899bb; --border:#e2e6f0;
  --correct:#2e7d52; --correct-bg:#eaf5ef; --nearly:#b8922a; --nearly-bg:#fdf6e3; --wrong:#c0392b; --wrong-bg:#fdecea;
  --radius:10px; --shadow:0 2px 16px rgba(26,39,68,.10);
  --aph-display:'Playfair Display',Georgia,'Times New Roman',serif;
  --aph-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
body{font-family:var(--aph-body);background:var(--cream);color:var(--text)}
button,input,select,textarea,optgroup{font-family:inherit}

/* ── 1 · Header: navy bar, gold rule; "AP <course>" white + app name gold; small-caps subtitle; ⌂ Home + portrait top right ── */
.aph-header{background:var(--navy);border-bottom:3px solid var(--gold);color:#fff}
.aph-header-in{display:flex;align-items:center;gap:12px;padding:10px 24px}
.aph-titles{flex:1;min-width:0}
.aph-title{font:700 1.3rem/1.2 var(--aph-display);color:#fff;margin:0}
.aph-title em{font-style:normal;color:var(--gold)}
.aph-sub{font-size:.75rem;line-height:1.35;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:#aab6d3;margin-top:3px}
.aph-home{font:700 .9375rem/1.1 var(--aph-body);color:var(--gold);background:rgba(201,168,76,.12);border:1.5px solid rgba(201,168,76,.7);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap;flex:none}
.aph-home:hover{background:rgba(201,168,76,.26);color:var(--gold2)}
.aph-avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;display:block;flex:none;background:#fff}
body.aph-at-home .aph-header .aph-home{display:none}   /* no Home on the home screen itself */

/* ── Page column, cards, headings, labels ── */
.aph-wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.aph-card{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:24px}
.aph-h{font:700 1.6rem/1.2 var(--aph-display);color:var(--navy);margin:0 0 16px}
.aph-label{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin:18px 0 8px}
.aph-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.aph-note{font-size:.8125rem;color:var(--text3)}
.aph-divider{border:0;border-top:1px solid var(--border);margin:20px 0}
.aph-select,.aph-input{font:500 .9375rem/1.2 var(--aph-body);color:var(--text);background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;max-width:100%;min-height:40px}
.aph-select{cursor:pointer}
.aph-swap{font:700 .9375rem/1.2 var(--aph-body);color:var(--nearly);background:#fff;border:1.5px solid var(--gold);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.aph-swap:hover{background:var(--nearly-bg)}

/* ── 4 · Buttons: main (navy + gold, full width, one per screen) · secondary (white, thin border) · option chips ── */
.aph-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 .9375rem/1.25 var(--aph-body);color:var(--text);background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;text-align:center;text-decoration:none;transition:background .12s,border-color .12s,color .12s}
.aph-btn:hover{border-color:var(--navy);color:var(--navy)}
.aph-btn:disabled{opacity:.45;cursor:not-allowed}
.aph-btn.on{border-color:var(--gold);background:var(--nearly-bg);color:var(--navy)}   /* a toggle that is switched on */
.aph-btn-primary{background:var(--navy);border-color:var(--navy);color:var(--gold2);font-weight:700;font-size:1.0625rem;padding:13px 18px;min-height:50px}
.aph-btn-primary:hover{background:var(--navy2);border-color:var(--navy2);color:var(--gold2)}
.aph-btn-block{display:flex;width:100%}
.aph-btn-sm{min-height:36px;padding:7px 12px;white-space:nowrap}
.aph-stack{display:grid;gap:8px}
.aph-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.aph-tools .aph-btn{padding:10px 8px}
.aph-chip{font:600 .9375rem/1.2 var(--aph-body);color:var(--text2);background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:6px 15px;min-height:36px;cursor:pointer;transition:background .12s,border-color .12s,color .12s}
.aph-chip:hover{border-color:var(--navy);color:var(--navy)}
.aph-chip.on,.aph-chip.on:hover{background:var(--navy);border-color:var(--navy);color:var(--gold2)}
.aph-step{width:38px;height:38px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--text);font:600 1.15rem/1 var(--aph-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.aph-step:hover{border-color:var(--navy)}
.aph-step-val{font-weight:700;font-size:1.05rem;color:var(--navy);min-width:46px;text-align:center}

/* ── Keyboard legend: the same three colours as the marking row ── */
.aph-keys{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 16px;margin-top:16px;font-size:.8125rem;color:var(--text2)}
.aph-keys>span{display:inline-flex;align-items:center;gap:6px}
.aph-key{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 6px;border-radius:6px;font-weight:800;font-size:.8125rem;border:1.5px solid transparent}
.aph-key.bad{border-color:var(--wrong);color:var(--wrong);background:#fff}
.aph-key.near{background:var(--nearly);border-color:var(--nearly);color:#fff}
.aph-key.ok{background:var(--correct);border-color:var(--correct);color:#fff}

/* ── 7 · ⚡ AP Speed Challenge banner (top of the set-up card) ── */
.aph-banner{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 4px;text-align:left;background:linear-gradient(135deg,var(--navy),#24366a);color:#fff;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit}
.aph-banner-icon{font-size:1.6rem;line-height:1;flex:none}
.aph-banner-text{flex:1;min-width:0}
.aph-banner-text b{display:block;color:var(--gold2);font-size:1rem;font-weight:700}
.aph-banner-text small{display:block;color:#c9d2ea;font-size:.8125rem;line-height:1.3;margin-top:1px}
.aph-banner-play{flex:none;background:var(--gold);color:var(--navy);font-weight:800;font-size:.9375rem;border-radius:8px;padding:8px 14px;white-space:nowrap}
.aph-banner:hover .aph-banner-play{background:var(--gold2)}

/* ── 5 · Drill screen: navy drill bar, card in the middle, side column stacks under it on narrow screens ── */
.aph-dbar{background:var(--navy);color:#fff;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:8px 16px;position:sticky;top:0;z-index:10}
.aph-dbar-title{font:700 1.1rem/1.2 var(--aph-body);color:var(--gold);margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aph-dbar-score{display:inline-flex;gap:10px;background:rgba(255,255,255,.1);border-radius:20px;padding:5px 12px;font-weight:700;font-size:.9375rem;white-space:nowrap}
.aph-dbar-score .ok{color:#6fcf97}.aph-dbar-score .bad{color:#ff8a80}
.aph-dbar-btn{font:600 .9375rem/1.1 var(--aph-body);color:#dfe5f3;background:transparent;border:1px solid rgba(255,255,255,.3);border-radius:7px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.aph-dbar-btn:hover{border-color:var(--gold);color:var(--gold2)}
.aph-dbar-btn.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.aph-dbar-btn:disabled{opacity:.4;cursor:not-allowed;border-color:rgba(255,255,255,.3);color:#dfe5f3}
.aph-progress{height:4px;background:var(--border)}
.aph-progress>div{height:100%;background:var(--gold);transition:width .4s}
.aph-drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,760px) minmax(0,1fr);gap:16px;padding:20px 16px 48px;align-items:start}
.aph-drill-main{grid-column:2;min-width:0}
.aph-drill-side{grid-column:3;display:grid;gap:10px;max-width:200px;min-width:0}
.aph-qcard{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px 20px 20px;text-align:center}
.aph-qmeta{font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:6px 0}
.aph-prompt{font:600 clamp(1.25rem,.85rem + 1.25vw,2.2rem)/1.35 var(--aph-body);color:var(--text);margin:8px 0 10px}
.aph-under{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.aph-side-keys{display:grid;gap:6px;font-size:.8125rem;color:var(--text2)}
.aph-side-keys>span{display:flex;align-items:center;gap:8px}
/* marking row: ✗ Major error (←) · ~ Nearly (↓) · ✓ Got it (→), key shown as a small second line */
.aph-mark{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.aph-mark.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.aph-mark-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 1rem/1.2 var(--aph-body);border:2px solid transparent;border-radius:10px;padding:11px 6px;min-height:60px;cursor:pointer;transition:background .12s,border-color .12s,filter .12s}
.aph-mark-btn small{display:block;font-weight:500;font-size:.75rem;opacity:.9;margin-top:3px}
.aph-mark-btn.bad{background:#fff;border-color:var(--wrong);color:var(--wrong)}
.aph-mark-btn.bad:hover{background:var(--wrong-bg)}
.aph-mark-btn.near{background:var(--nearly);border-color:var(--nearly);color:#fff}
.aph-mark-btn.ok{background:var(--correct);border-color:var(--correct);color:#fff}
.aph-mark-btn.near:hover,.aph-mark-btn.ok:hover{filter:brightness(.92)}
.aph-mark-btn.skip{background:#fff;border-color:var(--border);color:var(--text2)}
.aph-mark-btn.skip:hover{border-color:var(--navy)}

/* ── 6 · Results / error review ── */
.aph-results{max-width:560px;margin:0 auto;padding:28px 16px 48px}
.aph-res{text-align:center}
.aph-res-score{font:700 3rem/1 var(--aph-display);color:var(--navy)}
.aph-res-pct{font-size:.875rem;color:var(--text3);margin:6px 0 14px}
.aph-res-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px}
.aph-res-bar>div{height:100%;border-radius:3px}
.aph-revisit{background:var(--wrong-bg);border-radius:10px;padding:10px 12px 12px;text-align:left;margin-bottom:14px}
.aph-revisit-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.aph-revisit-title{font-weight:800;color:var(--wrong);font-size:.9375rem}
.aph-revisit-list{display:grid;gap:5px}
.aph-revisit-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:6px;padding:7px 10px;font-size:.875rem}
.aph-clean{background:var(--correct-bg);color:var(--correct);border-radius:8px;padding:12px;font-weight:600;font-size:.875rem;margin-bottom:14px}
.aph-res-actions{display:grid;gap:8px}
.aph-res-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

/* ── 8 · Panels (Generate Test, View & Print, Adjust) ── */
.aph-panel-top{max-width:608px;margin:20px auto 0}
.aph-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.aph-panel-title{font:700 1.3rem/1.2 var(--aph-display);color:var(--navy);margin:0}
.aph-out{margin-top:16px}

/* ── 8 · Print band (used inside printed / PDF sheets) ── */
.aph-pband{background:var(--navy);color:#fff;border-radius:6px 6px 0 0;padding:8px 14px;display:flex;align-items:center;gap:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.aph-pband-text{flex:1;min-width:0}
.aph-pkicker{font-size:.6rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--gold)}
.aph-ptitle{font:700 1.15rem/1.2 var(--aph-display);color:#fff;margin-top:2px}
.aph-ptitle em{font-style:normal;color:var(--gold)}
.aph-pmeta{font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#c9d2ea;margin-top:3px}
.aph-pband .aph-avatar{width:44px;height:44px}
.aph-pbtn{background:var(--gold);color:var(--navy);border:0;border-radius:4px;padding:5px 10px;font:700 .68rem var(--aph-body);cursor:pointer;white-space:nowrap}
.aph-pstrip{display:flex;justify-content:space-between;gap:12px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:#777;border:1px solid #e3e3e3;border-top:0;border-radius:0 0 6px 6px;padding:6px 14px;background:#fafafa;margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.aph-pband.aph-solo{border-radius:6px;margin-bottom:8px}
.aph-pfoot{font-size:.62rem;color:#999;text-align:right;padding-top:6px}
@media print{.aph-noprint{display:none!important}}

/* ── 9 · Phone and projector ── */
@media (min-width:1600px){.aph-drill{grid-template-columns:minmax(0,1fr) minmax(0,900px) minmax(0,1fr)}.aph-drill-side{max-width:230px}}
@media (max-width:900px){.aph-drill{grid-template-columns:minmax(0,1fr)}.aph-drill-main,.aph-drill-side{grid-column:1}.aph-drill-side{max-width:none}.aph-side-keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px}.aph-drill-side>.aph-btn{max-width:320px;justify-self:center}}
@media (max-width:640px){.aph-panel-top{margin:16px 16px 0}}
@media (max-width:600px){
  .aph-header-in{padding:10px 16px;gap:10px}
  .aph-title{font-size:1.1rem}
  .aph-home{padding:7px 10px;font-size:.875rem}
  .aph-card{padding:18px 16px}
  .aph-h{font-size:1.4rem}
  .aph-dbar{padding:8px 12px;gap:6px;flex-wrap:nowrap}
  .aph-dbar-title{font-size:.95rem;flex:1 1 auto}
  .aph-dbar-btn{font-size:.875rem;padding:6px 8px}
  .aph-dbar-score{font-size:.875rem;padding:4px 9px;gap:7px}
  .aph-drill{padding:14px 16px 40px}
  .aph-qcard{padding:14px 14px 16px}
  .aph-mark{gap:8px}
  .aph-mark-btn{font-size:.9375rem;padding:10px 4px}
  .aph-select{width:100%}
  .aph-row .aph-select{width:auto;flex:1 1 0;min-width:0}
}
@media (max-width:420px){.aph-tools{grid-template-columns:1fr}}
/* ===== END AP HOUSE STYLE ===== */
</style>
<style>
/* ===== Eton IPA Studio: app-specific bits ===== */
.ipa-back{min-height:36px;padding:7px 12px;white-space:nowrap}
.ipa-chips{display:flex;flex-wrap:wrap;gap:8px}
.ipa-chips .aph-chip small,.aph-chip small{opacity:.7;margin-left:6px;font-weight:700}
.ipa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.ipa-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:82px;background:#fff;border:2.5px solid var(--border);border-radius:12px;cursor:pointer;padding:8px 4px;color:var(--navy);transition:transform .1s,box-shadow .1s}
.ipa-tile:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--navy)}
.ipa-tile.ok{border-color:var(--correct);background:var(--correct-bg)}
.ipa-tile.near{border-color:var(--nearly);background:var(--nearly-bg)}
.ipa-tile.bad{border-color:var(--wrong);background:var(--wrong-bg)}
.ipa-sym{font-size:2rem;font-weight:600;line-height:1.1}
.ipa-ex{font-size:.8125rem;color:var(--text2)}
.ipa-k{display:inline-block;line-height:1.3;margin:3px 2px;padding:1px 8px;border-radius:10px;font-weight:700;font-size:.8125rem;border:2px solid}
.ipa-k.ok{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.ipa-k.near{border-color:var(--nearly);background:var(--nearly-bg);color:var(--nearly)}
.ipa-k.bad{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.ipa-big{font-size:clamp(3.2rem,2.2rem + 4vw,5.6rem);font-weight:600;line-height:1.1;color:var(--navy);text-align:center;margin:10px 0 4px;letter-spacing:.02em}
.ipa-big.sm{font-size:clamp(2rem,1.6rem + 2vw,3.2rem)}
.ipa-big.xl{font-size:clamp(4.5rem,3rem + 6vw,8rem)}
.ipa-wbig{font-size:clamp(2.2rem,1.6rem + 2.6vw,3.6rem);font-weight:700;color:var(--navy);text-align:center;margin:8px 0 2px}
.ipa-wbig.xl{font-size:clamp(3rem,2rem + 5vw,6rem)}
.ipa-hint{text-align:center;color:var(--text3);font-size:.9375rem;margin:4px 0 8px}
.ipa-d{text-align:center;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;font-size:.8125rem;margin:6px 0}
.ipa-tip{background:var(--cream);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;text-align:left;line-height:1.5;margin:10px 0}
.ipa-trap{background:#fff7e0;border:1.5px solid var(--gold);color:#6b5210;border-radius:10px;padding:10px 14px;margin:12px 0;text-align:left;line-height:1.45;font-size:.9375rem}
.ipa-wlist{display:grid;gap:8px}
.ipa-word{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--text)}
.ipa-word:hover{border-color:var(--navy)}
.ipa-w{font-weight:700;font-size:1.25rem}
.ipa-t{font-size:1.15rem;color:var(--navy)}
.ipa-t.big{font-size:1.6rem;font-weight:600}
.ipa-gl{color:var(--text3);font-size:.875rem;margin-left:auto}
.ipa-hit{color:#fff;background:var(--navy);border-radius:4px;padding:0 3px;font-weight:700}
.ipa-say{background:transparent;border:0;cursor:pointer;font-size:.6em;vertical-align:middle;padding:2px 6px;border-radius:8px}
.ipa-say:hover{background:var(--nearly-bg)}
.ipa-ans{text-align:center;margin:10px 0}
.ipa-ans .ipa-t{font-size:2.2rem;font-weight:600}
.ipa-note{border-top:1px solid var(--border);padding:12px 0;text-align:left}
.ipa-note h3{margin:0 0 4px;font-size:1rem;color:var(--navy)}
.ipa-note p{margin:0;line-height:1.55;color:var(--text2)}
.ipa-cur{outline:4px solid var(--navy);outline-offset:2px}
.ipa-prog{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--border);margin-top:6px}
.ipa-prog i{display:block;height:100%}.ipa-prog .ok{background:var(--correct)}.ipa-prog .near{background:var(--nearly)}.ipa-prog .bad{background:var(--wrong)}
.ipa-field{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px auto;max-width:460px;font-size:2rem;color:var(--text3)}
.ipa-field input{flex:1;min-width:0;font:600 2rem/1.2 var(--aph-body);color:var(--navy);text-align:center;border:0;border-bottom:3px solid var(--gold);background:transparent;padding:6px 4px;outline:none}
.ipa-kb{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:14px auto;max-width:680px}
.ipa-key{min-width:48px;height:52px;padding:0 10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--navy);font:600 1.45rem/1 var(--aph-body);cursor:pointer;box-shadow:0 2px 0 var(--border)}
.ipa-key:hover{border-color:var(--navy)}.ipa-key:active{transform:translateY(2px);box-shadow:none}
.ipa-key.stress{background:var(--nearly-bg);border-color:var(--gold)}
.ipa-key.wide{font-size:1rem;min-width:72px}
.ipa-res{margin:12px auto;max-width:560px;border-radius:10px;padding:10px 14px;text-align:left;border:2px solid}
.ipa-res.ok{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
.ipa-res.near{background:var(--nearly-bg);border-color:var(--nearly);color:#7a5d12}
.ipa-res.bad{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.ipa-cmp{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 40px;margin:8px 0}
.ipa-cmp>div{text-align:center}
.df-bad{color:var(--wrong);background:var(--wrong-bg);border-radius:4px;padding:0 2px;text-decoration:underline wavy}
.df-ok{color:var(--correct);background:var(--correct-bg);border-radius:4px;padding:0 2px}
.ipa-opts{display:grid;gap:10px;margin:14px auto;max-width:560px}
.ipa-opts.two{grid-template-columns:1fr 1fr}
.ipa-opt{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--navy);min-height:60px;text-align:left}
.ipa-opts.two .ipa-opt{flex-direction:column;justify-content:center;text-align:center;min-height:110px}
.ipa-opt:hover{border-color:var(--navy)}
.ipa-opt.right{border-color:var(--correct);background:var(--correct-bg)}
.ipa-opt.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.ipa-no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--gold2);font-weight:800;font-size:.8125rem;flex:none}
.ipa-lz{min-height:320px;display:flex;flex-direction:column;justify-content:center}
.ipa-lzipa{opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;min-height:70px;text-align:center}
.ipa-lzipa.show{opacity:1;transform:none}
.ipa-lzipa .ipa-t{font-size:clamp(2rem,1.4rem + 2.4vw,3.4rem);font-weight:600}
.ipa-lzrow{display:flex;justify-content:center;gap:16px;align-items:baseline;margin:6px 0}
/* speed challenge */
.sp-teams{display:flex;gap:10px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.sp-team{display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:30px;border:3px solid var(--border);background:#fff;font-weight:700}
.sp-team b{font-size:1.4rem}
.sp-team.cur{box-shadow:0 0 0 4px rgba(201,168,76,.45)}
.t0{--tc:#2a5db0}.t1{--tc:#c0392b}.t2{--tc:#2e7d52}.t3{--tc:#7b3fa0}
.sp-team[class*=" t"]{border-color:var(--tc)}.sp-team b{color:var(--tc)}
.sp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.sp-tile{aspect-ratio:1.4;font:800 clamp(1.4rem,1rem + 2vw,2.4rem)/1 var(--aph-body);border-radius:14px;border:2px solid var(--navy);background:var(--navy);color:var(--gold2);cursor:pointer}
.sp-tile:hover:not(:disabled){background:var(--navy2);transform:scale(1.03)}
.sp-tile.own{background:var(--tc);border-color:var(--tc);color:#fff;cursor:default}
.sp-tile.dead{background:#fff;border-color:var(--wrong);color:var(--wrong);cursor:default;opacity:.7}
.sp-clock{float:right;font-weight:800;font-size:1.6rem;color:var(--navy);border:3px solid var(--navy);border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center}
.sp-clock.low{border-color:var(--wrong);color:var(--wrong);animation:ipapulse .5s infinite alternate}
@keyframes ipapulse{to{transform:scale(1.12)}}
.sp-flash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--tc);color:#fff;font-weight:800;font-size:clamp(3rem,10vw,8rem);animation:ipaflash .3s steps(2) infinite;pointer-events:none}
.sp-flash small{font-size:.35em;letter-spacing:.3em}
@keyframes ipaflash{50%{filter:brightness(1.7)}}
/* printed test */
#pr{display:none}
.pr-score{font:700 1.6rem/1 var(--aph-display);color:#d00;border:3px solid #d00;border-radius:50%;width:84px;height:84px;display:flex;align-items:center;justify-content:center;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr-t{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:10px}
.pr-t th,.pr-t td{border-bottom:1px solid #ddd;padding:5px 6px;text-align:left}
.pr-t tr.bad td{color:#b00}.pr-t tr.near td{color:#8a6a00}
@media print{body.printing header,body.printing #app{display:none!important}body.printing #pr{display:block}}
@media (max-width:640px){.sp-grid{grid-template-columns:repeat(4,1fr)}.ipa-opts.two{grid-template-columns:1fr 1fr}}

/* ---- Course ---- */
.crs-big{font-size:1.05rem;padding:14px 16px;text-align:left}
.crs-big small{display:block;font-weight:400;opacity:.85;margin-top:3px;font-size:.78rem}
.crs-today{background:var(--bg-soft,#f6f1e4);border:1px solid var(--border,#e2d9bd);border-radius:12px;padding:12px;margin:12px 0}
.crs-item{border:1px solid var(--border,#ddd);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surface,#fff)}
.crs-item.locked{opacity:.65}.crs-item.done{border-color:var(--correct,#2e7d32)}.crs-item.chk{border-style:dashed}
.crs-top{display:flex;gap:10px;align-items:flex-start}
.crs-t{flex:1;min-width:0}
.crs-badge{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy,#14284b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.crs-item.done .crs-badge{background:var(--correct,#2e7d32)}.crs-item.locked .crs-badge{background:#999}
.crs-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.crs-chip{font-family:'DM Sans',sans-serif;border:2px solid var(--border,#ccc);border-radius:8px;padding:2px 9px;font-size:1.05rem}
.crs-chip.big{font-size:1.5rem;padding:4px 14px}.crs-chip.ok{border-color:var(--correct,#2e7d32)}.crs-chip.near{border-color:#d4a017}.crs-chip.bad{border-color:#c0392b}
.crs-card{text-align:left;font-size:1.02rem;line-height:1.55;margin:10px 0}
.crs-card p{margin:0 0 10px}.crs-card ol{margin:6px 0 10px 20px;padding:0}
.meet-en{margin:10px 0;font-size:1.05rem}
.ipa-wlist.meet .ipa-word{margin:4px 0}
</style>

(function () {
/* ===== IPA DATA ===== (nasal vowels are written with ~ after the vowel and converted to a combining tilde at load) */
var RAW = {
  fr: {
    name: 'French', tts: 'fr-FR',
    groups: [
      { id: 'v', name: 'Oral vowels' },
      { id: 'n', name: 'Nasal vowels' },

      { id: 'c', name: 'Special consonants' },
      { id: 'p', name: 'Plain consonants' },
      { id: 'x', name: 'Mixed words' }
    ],
    sounds: [
      ['v', 'i', 'close front unrounded', 'Smile, tongue high and forward. Shorter and tenser than English "ee".', [['si', 'si', 'if'], ['vie', 'vi', 'life'], ['ici', 'isi', 'here'], ['ville', 'vil', 'town']], ''],
      ['v', 'e', 'close-mid front unrounded', 'Like the start of English "day" but kept pure: no glide towards /i/. Usual in an open syllable: été, parler.', [['été', 'ete', 'summer'], ['parler', 'paʁle', 'to speak'], ['les', 'le', 'the (pl.)'], ['clé', 'kle', 'key']], 'e vs ɛ: open syllable → /e/ (été), closed syllable → /ɛ/ (mère, fête).'],
      ['v', 'ɛ', 'open-mid front unrounded', 'Like English "bed" with the mouth more open. Usual in a closed syllable: mère, fête; also -ais, -ait.', [['mère', 'mɛʁ', 'mother'], ['fête', 'fɛt', 'party'], ['lait', 'lɛ', 'milk'], ['merci', 'mɛʁsi', 'thank you']], ''],
      ['v', 'a', 'open front unrounded', 'A front "a", not the back "a" of English "father". The everyday a of patte, chat, là.', [['chat', 'ʃa', 'cat'], ['patte', 'pat', 'paw'], ['là', 'la', 'there'], ['ami', 'ami', 'friend']], ''],
      ['v', 'ɑ', 'open back unrounded', 'A back "a" as in pâte, bas. Fading: many Parisian speakers now say /a/ here, so check whether your course keeps /ɑ/.', [['pâte', 'pɑt', 'pasta'], ['bas', 'bɑ', 'low'], ['âne', 'ɑn', 'donkey'], ['âme', 'ɑm', 'soul']], 'pâte /pɑt/ vs patte /pat/ is a traditional contrast only.'],
      ['v', 'ɔ', 'open-mid back rounded', 'Like English "off", lips rounded. Usual in a closed syllable: porte, sol, homme.', [['porte', 'pɔʁt', 'door'], ['sol', 'sɔl', 'ground'], ['homme', 'ɔm', 'man'], ['école', 'ekɔl', 'school']], ''],
      ['v', 'o', 'close-mid back rounded', 'Lips rounded and pushed forward; a pure vowel with no glide towards /u/ (English "go" glides). Open syllable, or before /z/: beau, mot, rose.', [['beau', 'bo', 'beautiful'], ['mot', 'mo', 'word'], ['rose', 'ʁoz', 'pink'], ['chaud', 'ʃo', 'hot']], 'o vs ɔ: open syllable → /o/ (beau), closed syllable → /ɔ/ (porte); but rose /ʁoz/.'],
      ['v', 'u', 'close back rounded', 'Like "oo" in "too" but with the lips tighter and further forward.', [['tout', 'tu', 'all'], ['vous', 'vu', 'you'], ['route', 'ʁut', 'road'], ['jour', 'ʒuʁ', 'day']], ''],
      ['v', 'y', 'close front rounded', 'Say /i/, keep the tongue exactly where it is, then round the lips as for /u/. No English equivalent.', [['tu', 'ty', 'you'], ['rue', 'ʁy', 'street'], ['lune', 'lyn', 'moon'], ['sur', 'syʁ', 'on']], 'Not /u/: tu /ty/ is not tout /tu/.'],
      ['v', 'ø', 'close-mid front rounded', 'Say /e/ and round the lips. Open syllable, or before /z/: deux, peu, heureuse.', [['deux', 'dø', 'two'], ['peu', 'pø', 'little'], ['bleu', 'blø', 'blue'], ['heureux', 'øʁø', 'happy']], ''],
      ['v', 'œ', 'open-mid front rounded', 'Say /ɛ/ and round the lips. Closed syllable: peur, sœur, fleur (but not before /z/).', [['peur', 'pœʁ', 'fear'], ['sœur', 'sœʁ', 'sister'], ['fleur', 'flœʁ', 'flower'], ['cœur', 'kœʁ', 'heart']], 'ø vs œ follows the same open/closed pattern as e v ɛ and o v ɔ.'],
      ['v', 'ə', 'mid central (schwa)', 'The weak vowel of le, je, demain: lips slightly rounded. It is often dropped altogether (the "mute e"); transcriptions vary on this.', [['le', 'lə', 'the'], ['je', 'ʒə', 'I'], ['demain', 'dəmɛ~', 'tomorrow'], ['petit', 'pəti', 'small']], ''],

      ['n', 'ɑ~', 'open back nasal', 'Say /ɑ/ with the air also going through the nose. The n or m is NOT pronounced.', [['dans', 'dɑ~', 'in'], ['vent', 'vɑ~', 'wind'], ['enfant', 'ɑ~fɑ~', 'child'], ['temps', 'tɑ~', 'time']], 'dans /dɑ̃/ is not /dɑn/: no consonant is heard.'],
      ['n', 'ɛ~', 'open-mid front nasal', 'Say /ɛ/ through the nose. Spelt in, im, ain, ein, and -ien = /jɛ̃/.', [['vin', 'vɛ~', 'wine'], ['main', 'mɛ~', 'hand'], ['pain', 'pɛ~', 'bread'], ['bien', 'bjɛ~', 'well']], ''],
      ['n', 'ɔ~', 'open-mid back nasal', 'Rounded lips, through the nose. The symbol is ɔ but the sound is close to /o/. Spelt on, om.', [['bon', 'bɔ~', 'good'], ['nom', 'nɔ~', 'name'], ['long', 'lɔ~', 'long'], ['maison', 'mɛzɔ~', 'house']], ''],
      ['n', 'œ~', 'open-mid front rounded nasal', 'Say /œ/ through the nose. Many speakers now merge it with /ɛ̃/: check whether your course keeps it.', [['un', 'œ~', 'one'], ['brun', 'bʁœ~', 'brown'], ['lundi', 'lœ~di', 'Monday'], ['parfum', 'paʁfœ~', 'perfume']], ''],
