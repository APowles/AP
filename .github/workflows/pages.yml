name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gather files for Pages
        run: |
          # Publish the WHOLE site (pages, pictures, sounds, icons, tests, pamphlets, guides, version files...).
          # Only git's own folders are left out (the games load files from _tools/ too). Never trim this to a list of folders: anything left out
          # (e.g. pictures/) silently disappears from the live apps.
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          touch _site/.nojekyll
          du -sh _site
          test -f _site/pictures/17.jpg && test -f _site/version.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # 30 minutes: the whole site takes GitHub longer than the 10-minute default to go live
